[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
description = "Personal Second Brain — your digital memory"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.0",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "faiss-cpu>=1.7",
    "numpy>=1.21",
    "scipy>=1.10",
    "openai>=1.0",
    "google-genai>=1.0",
    "Pillow>=10.0",
    "easyocr>=1.7",
    "watchdog>=4.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
lifeos = "app.cli.commands:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
